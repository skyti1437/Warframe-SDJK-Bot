# 本文件只用于统一 ruff 静态检查（AstrBot 官方插件开发原则第 5 条：
# 「在进行提交前，请使用 ruff 工具格式化您的代码」）。
#
# 用法：pip install ruff && python -m ruff check .
#
# 取舍说明（2026-09-25 立）：
#   · select 只保留**能抓真缺陷**的族（E4/E7/E9/F/W）——它们在本仓历史里抓到过
#     两处 F821（未定义名，必崩）与一处 F601（重复字典键，静默覆盖）；
#   · ignore 里的三条是本仓**有意为之**的写法：单行 if/分号（E701/E702，密集的
#     守卫/构建脚本里更易读）、`l` 之类的短变量名（E741，仅出现在开发脚本）；
#   · `ruff format`（全仓重排 73 文件）尚未执行：会淹没 git 历史，等单独一轮
#     风格提交再做——届时本文件的 line-length 以实测最长行（100 以内）为准。
line-length = 100

[tool.ruff]
line-length = 100
# 只扫「随包/开源仓」的源码；以下目录不是分发包内容（开发工程、归档、构建产物、
# 原始下载缓存、运维脚本归档）：.zcode 是迁移工程与开发探针，docs 是报告，
# dist 是构建输出，kb_src/_cache 是上游原始数据，runtime/data 是本地运行产物。
# ⚠️ 工作区缓存目录写成 glob（`.work*`）：它的字面名是**分发敏感词**，
#    写全名会让 Gate B（六词零命中）拦下整个开源包（2026-09-25 实际被拦）。
extend-exclude = [".zcode", ".work*", ".archive", ".mimosa", ".pytest_cache",
                  "dist", "docs", "kb_src", "runtime", "data", "_cache", "envs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E501",  # 行长由人工控制（注释/文案里有意排齐）；line-length 仅作兜底
    "E701",  # 单行 if x: y —— 紧凑守卫，本仓大量使用
    "E702",  # 单行分号 —— 同上
    "E741",  # 短变量名（l/o/I）—— 仅开发脚本
]

[tool.ruff.lint.per-file-ignores]
# 打包脚本里有刻意的长模板字符串与对齐表
"dist/package_release.py" = ["E501"]
"scripts/make_market_zip.py" = ["E501"]
