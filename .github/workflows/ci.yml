name: ci

# 代码门禁：push / PR 跑 regression（ruff + tests/test_*.py + 伤害审计），与本地
#   python scripts/run_checks.py regression
# 是同一条命令。随包时效数据的新鲜度（health）**不进**代码门禁 —— 种子会随日期自然过期，
# 不能让每个无关 PR 跟着变红；需要时在 Actions 页手动 workflow_dispatch 选 health / all。
# 无项目凭据、只读权限、不发布不部署。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "检查类别"
        type: choice
        default: regression
        options: [regression, health, all]

permissions:
  contents: read

jobs:
  regression:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = README 声明的支持下限；3.12 = 本地开发实测版本
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装运行依赖 + 检查依赖
        run: python -m pip install -r requirements.txt -r scripts/requirements-dev.txt
      - name: regression
        run: python scripts/run_checks.py regression --log-dir "$RUNNER_TEMP/checks"
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-regression-py${{ matrix.python }}
          path: ${{ runner.temp }}/checks
          retention-days: 7

  health:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'regression'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt
      - name: health（随包数据新鲜度，非代码回归）
        run: python scripts/run_checks.py health --log-dir "$RUNNER_TEMP/checks"

  # ★ 2026-10-16：开源包内回归（v1.2.1 公开仓 CI 红的教训 —— 私有树带着、开源包排除的文件，
  #   私有树测试全过也照样会在公开仓炸）。生成开源 stage 后在 stage 里跑同一条 regression。
  #   公开仓没有 dist/package_release.py（打包脚本不随开源包分发）⇒ 本作业在那里只出一条 notice 后跳过。
  oss-stage:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: 是否有打包脚本
        id: probe
        run: |
          if [ -f dist/package_release.py ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::本仓库不带 dist/package_release.py（开源仓），跳过开源包内回归"
          fi
      - uses: actions/setup-python@v5
        if: steps.probe.outputs.has == 'true'
        with:
          python-version: "3.12"
      - name: 安装运行依赖 + 检查依赖
        if: steps.probe.outputs.has == 'true'
        run: python -m pip install -r requirements.txt -r scripts/requirements-dev.txt
      - name: 生成开源 stage（不打 zip、不过种子闸门）
        if: steps.probe.outputs.has == 'true'
        run: python dist/package_release.py --stage-only
      - name: regression（在开源 stage 内）
        if: steps.probe.outputs.has == 'true'
        working-directory: dist/oss-selfcheck/astrbot_plugin_warframe_sdjkbot
        run: python scripts/run_checks.py regression --log-dir "$RUNNER_TEMP/checks"
      - name: 上传日志
        if: always() && steps.probe.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checks-oss-stage
          path: ${{ runner.temp }}/checks
          retention-days: 7
