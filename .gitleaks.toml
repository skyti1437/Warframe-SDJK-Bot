# gitleaks 自定义规则 —— 在默认规则（密钥/Token 格式）基础上追加本仓库专项：
# 拦截开发机绝对路径（C:/Users/xxx、D:\home\xxx、/home/xxx、/root/xxx）。
# 背景：2026-09-18 开源审查发现历史里残留过 C:/Users/<本机用户名>/... 路径
# （已 filter-repo 重写清除），需要一道自动闸门防止复发。
#
# 注意：
# - [extend] useDefault = true 必须保留，否则本文件会完全替换内置规则，
#   密钥类检测将全部失效。
# - 路径中的用户名限定为常见字符集（字母数字._-），避免误报文档里的
#   「C:/Users/<用户名>/...」这类尖括号占位符。

[extend]
useDefault = true

[[rules]]
id = "local-user-path"
description = "开发机绝对路径泄露（C:/Users/...、/home/...、/root/...）"
regex = '''(?i)[a-z]:[/\\]{1,2}(users|home)[/\\][a-z0-9._-]+|/(home|root)/[a-z0-9._-]+'''

# ★ 2026-10-27：v1.2.7 首次同步时，`scripts/build_enemies.py`（用法示例）与
#   `tests/test_damage_review_b.py`（构建输入目录默认值）带过本机绝对路径；
#   **当前树已改掉**（示例改占位符、测试改读 WF_BUILD_INPUTS），但这两处仍在
#   历史提交里，而本仓库的 CI 是 `--all --full-history` 全历史扫描。
#   这里做**最窄豁免**：仅这两个文件的路径型命中（condition=AND），
#   不按提交豁免、不按文件整体豁免 ⇒ 同文件里的密钥类规则仍然生效。
[[allowlists]]
description = "历史提交里两个构建/测试文件曾用本机绝对路径（当前树已清除）"
condition = "AND"
paths = [
  '''(^|/)scripts/build_enemies\.py$''',
  '''(^|/)tests/test_damage_review_b\.py$''',
]
regexTarget = "match"
regexes = ['''/root/''', '''/home/''']
